name: Deploy to TestFlight

on:
  push:
    branches: [main, release/*]
  workflow_dispatch:
    inputs:
      distribute_external:
        description: "Distribute to external testers?"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      testflight_groups:
        description: "TestFlight groups (comma-separated)"
        required: false
        default: "Core Testers,Public Beta"
        type: string

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: "16.3"
  SCHEME: "StressMonitor"
  PROJECT: "StressMonitor/StressMonitor.xcodeproj"
  LANG: "en_US.UTF-8"

jobs:
  test:
    name: Lint, Test & Build watchOS
    uses: ./.github/workflows/_test.yml
    with:
      run_tests: true

  deploy:
    name: Build & Deploy to TestFlight
    needs: test
    runs-on: macos-15
    timeout-minutes: 90
    environment: production # Requires approval gate in GitHub Settings → Environments
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer
          xcodebuild -version

      - name: Cache Ruby Gems
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: gems-${{ runner.os }}-${{ hashFiles('**/Gemfile.lock') }}

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: derived-${{ runner.os }}-${{ hashFiles('StressMonitor/StressMonitor.xcodeproj/project.pbxproj') }}
          restore-keys: |
            derived-${{ runner.os }}-${{ hashFiles('StressMonitor/StressMonitor.xcodeproj/project.pbxproj') }}-

      - name: Install Dependencies
        run: |
          bundle config path vendor/bundle
          bundle install --jobs 4 --retry 3

      - name: Free Disk Space
        run: |
          df -h /
          sudo rm -rf /Applications/Xcode_15*.app 2>/dev/null || true
          sudo rm -rf /Users/runner/Library/Android 2>/dev/null || true
          df -h /

      - name: Build & Deploy via Fastlane
        env:
          # App Store Connect API
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          # Match (code signing)
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          # App info
          APP_IDENTIFIER: ${{ secrets.APP_IDENTIFIER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          ITC_TEAM_ID: ${{ secrets.ITC_TEAM_ID }}
          # Distribution
          DISTRIBUTE_EXTERNAL: ${{ github.event.inputs.distribute_external || 'true' }}
          TESTFLIGHT_GROUPS: ${{ github.event.inputs.testflight_groups || 'Core Testers,Public Beta' }}
          # Notifications
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: bundle exec fastlane beta

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: |
            ~/Library/Logs/gym/*.log
            fastlane/report.xml
          retention-days: 14
