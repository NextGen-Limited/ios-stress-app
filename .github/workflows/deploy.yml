name: Deploy to TestFlight

on:
  push:
    branches: [main, release/*]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip all tests?"
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: "26.3"
  SCHEME: "StressMonitor"
  PROJECT: "StressMonitor/StressMonitor.xcodeproj"
  LANG: "en_US.UTF-8"

jobs:
  test:
    name: Lint, Test & Build watchOS
    uses: ./.github/workflows/_test.yml
    with:
      skip_tests: ${{ inputs.skip_tests || false }}
      run_tests: true
      run_watchos_tests: false

  deploy:
    name: Build & Deploy to TestFlight
    needs: test
    runs-on: macos-15
    timeout-minutes: 35
    environment: production # Requires approval gate in GitHub Settings → Environments
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer
          xcodebuild -version

      - name: Cache Ruby Gems
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: gems-${{ runner.os }}-${{ hashFiles('**/Gemfile.lock') }}

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: derived-${{ runner.os }}-${{ hashFiles('StressMonitor/StressMonitor.xcodeproj/project.pbxproj') }}
          restore-keys: |
            derived-${{ runner.os }}-${{ hashFiles('StressMonitor/StressMonitor.xcodeproj/project.pbxproj') }}-

      - name: Cache SPM Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages/checkouts
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages/repositories
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Install Dependencies
        run: |
          bundle config path vendor/bundle
          bundle install --jobs 4 --retry 3

      - name: Free Disk Space
        run: |
          df -h /
          sudo rm -rf /Applications/Xcode_15*.app 2>/dev/null || true
          sudo rm -rf /Users/runner/Library/Android 2>/dev/null || true
          df -h /

      - name: Build & Deploy via Fastlane
        env:
          # App Store Connect API
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          # Match (code signing)
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          # App info — single source of truth
          APP_IDENTIFIER: "stress.ai.com"
          WATCH_APP_IDENTIFIER: "stress.ai.com.watchkitapp"
          WIDGET_APP_IDENTIFIER: "stress.ai.com.widget"
          APPLE_ID: "95doanphuong@gmail.com"
          TEAM_ID: "K2TYLYAWMK"
          ITC_TEAM_ID: "K2TYLYAWMK"
          # Notifications
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: bundle exec fastlane upload_beta

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: |
            ~/Library/Logs/gym/*.log
            fastlane/report.xml
          retention-days: 14
