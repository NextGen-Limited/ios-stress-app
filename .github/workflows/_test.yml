name: _test  # Reusable — called by ci.yml and deploy.yml

on:
  workflow_call:
    inputs:
      run_tests:
        description: "Run unit tests?"
        required: false
        default: true
        type: boolean
      run_watchos_tests:
        description: "Run watchOS tests?"
        required: false
        default: false
        type: boolean

env:
  XCODE_VERSION: "26.3"
  SCHEME: "StressMonitor"
  LANG: "en_US.UTF-8"

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer
          xcodebuild -version

      - name: Install iOS Simulator Runtime
        run: |
          # Check if an eligible iOS simulator exists for the StressMonitor scheme
          if ! xcodebuild -showdestinations -scheme StressMonitor -project StressMonitor/StressMonitor.xcodeproj 2>/dev/null | grep -q "iOS Simulator"; then
            echo "No eligible iOS Simulator found — downloading iOS platform..."
            xcodebuild -downloadPlatform iOS
          fi

      - name: Find or Create iPhone Simulator
        id: iphone_sim
        run: |
          # Find an iPhone simulator with iOS 26.x runtime (project requires iOS 26.1+)
          # Prefer iPhone 17 — Xcode 26 runners ship with it; plain "iPhone 16" is not a valid destination
          SIM_NAME=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          preferred = ['iPhone 17', 'iPhone 17 Pro', 'iPhone 16 Pro', 'iPhone Air']
          # First pass: exact preferred names on iOS 26.x
          for name in preferred:
            for runtime, devices in data.get('devices', {}).items():
              if 'iOS' in runtime and '26.' in runtime:
                for d in devices:
                  if d.get('isAvailable') and d.get('name') == name:
                    print(d['name'])
                    sys.exit(0)
          # Fallback to any iPhone on iOS 26.x
          for runtime, devices in data.get('devices', {}).items():
            if 'iOS' in runtime and '26.' in runtime:
              for d in devices:
                if d.get('isAvailable') and 'iPhone' in d.get('name', ''):
                  print(d['name'])
                  sys.exit(0)
          print('')
          ")

          if [ -z "$SIM_NAME" ]; then
            echo "No iPhone 26.x simulator found — creating one..."
            # Find the latest iOS 26.x runtime identifier
            RUNTIME_ID=$(xcrun simctl list runtimes -j | python3 -c "
            import json, sys
            data = json.load(sys.stdin)
            for r in sorted(data.get('runtimes', []), key=lambda x: x.get('version', ''), reverse=True):
              if 'iOS' in r.get('name', '') and r.get('isAvailable') and '26.' in r.get('version', ''):
                print(r['identifier'])
                sys.exit(0)
            print('')
            ")
            if [ -z "$RUNTIME_ID" ]; then
              echo "ERROR: No iOS 26.x runtime available to create simulator"
              exit 1
            fi
            echo "Using runtime: $RUNTIME_ID"
            xcrun simctl create "iPhone 17" "com.apple.CoreSimulator.SimDeviceType.iPhone-17" "$RUNTIME_ID"
            SIM_NAME="iPhone 17"
          fi

          echo "sim_name=$SIM_NAME" >> $GITHUB_OUTPUT
          echo "Using iPhone simulator: $SIM_NAME"

      - name: Setup Ruby & Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: derived-${{ runner.os }}-${{ hashFiles('StressMonitor/StressMonitor.xcodeproj/project.pbxproj') }}
          restore-keys: |
            derived-${{ runner.os }}-${{ hashFiles('StressMonitor/StressMonitor.xcodeproj/project.pbxproj') }}-

      - name: Cache SPM Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages/checkouts
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages/repositories
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Run SwiftLint
        run: |
          if which swiftlint >/dev/null 2>&1; then
            swiftlint lint --reporter github-actions-logging || true
          else
            brew install swiftlint
            swiftlint lint --reporter github-actions-logging || true
          fi

      - name: Run Tests
        if: ${{ inputs.run_tests != false }}
        continue-on-error: true
        env:
          SCAN_DEVICE: ${{ steps.iphone_sim.outputs.sim_name }}
        run: |
          bundle exec fastlane test

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: fastlane/test_output/
          retention-days: 7

  test-watchos:
    name: Test watchOS
    runs-on: macos-15
    timeout-minutes: 30
    if: ${{ inputs.run_watchos_tests != false }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer
          xcodebuild -version

      - name: Setup Ruby & Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install watchOS Simulator
        run: |
          if ! xcodebuild -showdestinations -scheme "StressMonitorWatch Watch App" -project StressMonitor/StressMonitor.xcodeproj 2>/dev/null | grep -q "watchOS Simulator"; then
            echo "Installing watchOS Simulator runtime..."
            xcodebuild -downloadPlatform watchOS
          fi

      - name: Find watchOS Simulator
        id: watch_sim
        run: |
          SIM_NAME=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          # Prefer Apple Watch Series 10, then any Apple Watch
          for runtime, devices in data.get('devices', {}).items():
            if 'watchOS' in runtime:
              for d in devices:
                if d.get('isAvailable') and 'Series 10' in d.get('name', ''):
                  print(d['name'])
                  sys.exit(0)
          # Fallback to any available Apple Watch
          for runtime, devices in data.get('devices', {}).items():
            if 'watchOS' in runtime:
              for d in devices:
                if d.get('isAvailable') and 'Watch' in d.get('name', ''):
                  print(d['name'])
                  sys.exit(0)
          print('')
          ")
          echo "sim_name=$SIM_NAME" >> $GITHUB_OUTPUT
          echo "Using watchOS simulator: $SIM_NAME"

      - name: Run watchOS Tests
        env:
          SCAN_WATCH_DEVICE: ${{ steps.watch_sim.outputs.sim_name }}
        run: |
          bundle exec fastlane test_watchos

      - name: Upload watchOS Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: watchos-test-results
          path: fastlane/test_output_watchos/
          retention-days: 7

  build-watchos:
    name: Build watchOS
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer
          xcodebuild -version

      - name: Build watchOS
        run: |
          set -o pipefail
          # Install watchOS platform if missing
          if ! xcodebuild -showdestinations -scheme "StressMonitorWatch Watch App" -project StressMonitor/StressMonitor.xcodeproj 2>/dev/null | grep -q "watchOS Simulator"; then
            echo "Installing watchOS Simulator runtime..."
            xcodebuild -downloadPlatform watchOS
          fi
          xcodebuild build \
            -project StressMonitor/StressMonitor.xcodeproj \
            -scheme "StressMonitorWatch Watch App" \
            -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty

  build-widget:
    name: Build Widget
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer
          xcodebuild -version

      - name: Install iOS Platform
        run: |
          if ! xcodebuild -showdestinations -scheme StressMonitorWidgetExtension -project StressMonitor/StressMonitor.xcodeproj 2>/dev/null | grep -q "iOS"; then
            echo "No eligible iOS platform found — downloading..."
            xcodebuild -downloadPlatform iOS
          fi

      - name: Build Widget Extension
        run: |
          set -o pipefail
          xcodebuild build \
            -project StressMonitor/StressMonitor.xcodeproj \
            -scheme "StressMonitorWidgetExtension" \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty
