name: _test  # Reusable — called by ci.yml and deploy.yml

on:
  workflow_call:
    inputs:
      run_tests:
        description: "Run unit tests?"
        required: false
        default: true
        type: boolean
      run_watchos_tests:
        description: "Run watchOS tests?"
        required: false
        default: true
        type: boolean

env:
  XCODE_VERSION: "16.3"
  SCHEME: "StressMonitor"
  LANG: "en_US.UTF-8"

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      matrix:
        destination:
          - "platform=iOS Simulator,name=iPhone 16,OS=latest"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer
          xcodebuild -version

      - name: Boot iOS Simulator
        id: simulator
        run: |
          # Find available iPhone simulator
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          data = json.load(sys.stdin)
          for runtime, devices in data.get('devices', {}).items():
            if 'iOS' in runtime:
              for d in devices:
                if d.get('isAvailable'):
                  print(d['udid'])
                  sys.exit(0)
          print('')
          ")
          if [ -n "$SIM_ID" ]; then
            echo "Found simulator: $SIM_ID"
            xcrun simctl boot "$SIM_ID" 2>/dev/null || true
            echo "sim_id=$SIM_ID" >> $GITHUB_OUTPUT
          else
            echo "WARNING: No iOS simulator available"
            echo "sim_id=" >> $GITHUB_OUTPUT
          fi

      - name: Setup Ruby & Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: derived-${{ runner.os }}-${{ hashFiles('StressMonitor/StressMonitor.xcodeproj/project.pbxproj') }}
          restore-keys: |
            derived-${{ runner.os }}-${{ hashFiles('StressMonitor/StressMonitor.xcodeproj/project.pbxproj') }}-

      - name: Cache SPM Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages/checkouts
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages/repositories
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Run SwiftLint
        run: |
          if which swiftlint >/dev/null 2>&1; then
            swiftlint lint --reporter github-actions-logging || true
          else
            brew install swiftlint
            swiftlint lint --reporter github-actions-logging || true
          fi

      - name: Run Tests (${{ matrix.destination }})
        if: ${{ inputs.run_tests != false }}
        env:
          SCAN_DEVICE: ${{ steps.simulator.outputs.sim_id && format('platform=iOS Simulator,id={0}', steps.simulator.outputs.sim_id) || '' }}
        run: |
          bundle exec fastlane test

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: fastlane/test_output/
          retention-days: 7

  test-watchos:
    name: Test watchOS
    runs-on: macos-15
    timeout-minutes: 30
    if: ${{ inputs.run_watchos_tests != false }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer
          xcodebuild -version

      - name: Setup Ruby & Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install watchOS Simulator
        run: |
          if ! xcodebuild -showdestinations -scheme "StressMonitorWatch Watch App" -project StressMonitor/StressMonitor.xcodeproj 2>/dev/null | grep -q "watchOS Simulator"; then
            echo "Installing watchOS Simulator runtime..."
            xcodebuild -downloadPlatform watchOS
          fi

      - name: Run watchOS Tests
        run: |
          bundle exec fastlane test_watchos

      - name: Upload watchOS Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: watchos-test-results
          path: fastlane/test_output_watchos/
          retention-days: 7

  build-watchos:
    name: Build watchOS
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer
          xcodebuild -version

      - name: Build watchOS
        run: |
          set -o pipefail
          # Install watchOS platform if missing
          if ! xcodebuild -showdestinations -scheme "StressMonitorWatch Watch App" -project StressMonitor/StressMonitor.xcodeproj 2>/dev/null | grep -q "watchOS Simulator"; then
            echo "Installing watchOS Simulator runtime..."
            xcodebuild -downloadPlatform watchOS
          fi
          xcodebuild build \
            -project StressMonitor/StressMonitor.xcodeproj \
            -scheme "StressMonitorWatch Watch App" \
            -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty

  build-widget:
    name: Build Widget
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer
          xcodebuild -version

      - name: Build Widget Extension
        run: |
          set -o pipefail
          xcodebuild build \
            -project StressMonitor/StressMonitor.xcodeproj \
            -scheme "StressMonitorWidgetExtension" \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty
