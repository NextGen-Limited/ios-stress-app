name: _test  # Reusable — called by ci.yml and deploy.yml

on:
  workflow_call:

env:
  XCODE_VERSION: "26.3"
  SCHEME: "StressMonitor"
  LANG: "en_US.UTF-8"

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer
          xcodebuild -version

      - name: Setup Ruby & Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install xcpretty
        run: gem install xcpretty --no-document

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: derived-${{ runner.os }}-${{ hashFiles('StressMonitor/StressMonitor.xcodeproj/project.pbxproj') }}
          restore-keys: |
            derived-${{ runner.os }}-${{ hashFiles('StressMonitor/StressMonitor.xcodeproj/project.pbxproj') }}-

      - name: Cache SPM Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages/checkouts
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages/repositories
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Run SwiftLint
        run: |
          if which swiftlint >/dev/null 2>&1; then
            swiftlint lint --reporter github-actions-logging || true
          else
            brew install swiftlint
            swiftlint lint --reporter github-actions-logging || true
          fi

      - name: Build iOS
        run: |
          set -o pipefail
          xcodebuild build \
            -project StressMonitor/StressMonitor.xcodeproj \
            -scheme "$SCHEME" \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty

  build-watchos:
    name: Build watchOS
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer
          xcodebuild -version

      - name: Install xcpretty
        run: gem install xcpretty --no-document

      - name: Build watchOS
        run: |
          set -o pipefail
          if ! xcodebuild -showdestinations -scheme "StressMonitorWatch Watch App" -project StressMonitor/StressMonitor.xcodeproj 2>/dev/null | grep -q "watchOS Simulator"; then
            echo "Installing watchOS Simulator runtime..."
            xcodebuild -downloadPlatform watchOS
          fi
          xcodebuild build \
            -project StressMonitor/StressMonitor.xcodeproj \
            -scheme "StressMonitorWatch Watch App" \
            -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty

  build-widget:
    name: Build Widget
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer
          xcodebuild -version

      - name: Install xcpretty
        run: gem install xcpretty --no-document

      - name: Install iOS Platform
        run: |
          if ! xcodebuild -showdestinations -scheme StressMonitorWidgetExtension -project StressMonitor/StressMonitor.xcodeproj 2>/dev/null | grep -q "iOS"; then
            echo "No eligible iOS platform found — downloading..."
            xcodebuild -downloadPlatform iOS
          fi

      - name: Build Widget Extension
        run: |
          set -o pipefail
          xcodebuild build \
            -project StressMonitor/StressMonitor.xcodeproj \
            -scheme "StressMonitorWidgetExtension" \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty

  test:
    name: Test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer
          xcodebuild -version

      - name: Install xcpretty
        run: gem install xcpretty --no-document

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: derived-${{ runner.os }}-${{ hashFiles('StressMonitor/StressMonitor.xcodeproj/project.pbxproj') }}
          restore-keys: |
            derived-${{ runner.os }}-

      - name: Cache SPM Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages/checkouts
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages/repositories
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Resolve available iPhone Simulator
        id: simulator
        run: |
          set -o pipefail
          resolve_udid() {
            xcodebuild -showdestinations -project StressMonitor/StressMonitor.xcodeproj -scheme "$SCHEME" 2>/dev/null \
              | grep -E 'platform:iOS Simulator.*name:iPhone' \
              | head -1 \
              | grep -oE 'id:[0-9A-F-]{36}' | cut -d: -f2
          }

          UDID=$(resolve_udid)

          # Rare runner-image state with zero pre-provisioned concrete simulators
          # (only "Any iOS Simulator Device" placeholder) — provision one instead
          # of failing outright.
          if [ -z "$UDID" ]; then
            echo "No iPhone destination found for scheme $SCHEME — provisioning one." >&2
            RUNTIME=$(xcrun simctl list runtimes available -j | python3 -c "import sys, json; runtimes=[r for r in json.load(sys.stdin)['runtimes'] if 'iOS' in r['name']]; runtimes.sort(key=lambda r: tuple(int(x) for x in r['version'].split('.'))); print(runtimes[-1]['identifier'] if runtimes else '')")
            DEVTYPE=$(xcrun simctl list devicetypes -j | python3 -c "import sys, json; types=[d['identifier'] for d in json.load(sys.stdin)['devicetypes'] if d['identifier'].startswith('com.apple.CoreSimulator.SimDeviceType.iPhone')]; print(types[0] if types else '')")
            if [ -z "$RUNTIME" ] || [ -z "$DEVTYPE" ]; then
              echo "::error::No iOS runtime or iPhone device type available to provision a simulator." >&2
              xcrun simctl list runtimes >&2
              xcrun simctl list devicetypes >&2
              exit 1
            fi
            echo "Creating simulator: device=$DEVTYPE runtime=$RUNTIME" >&2
            xcrun simctl create "ci-iphone" "$DEVTYPE" "$RUNTIME" >&2
            UDID=$(resolve_udid)
          fi

          if [ -z "$UDID" ]; then
            echo "::error::No iPhone Simulator destination found for scheme $SCHEME on this runner, even after provisioning." >&2
            echo "Full destination list:" >&2
            xcodebuild -showdestinations -project StressMonitor/StressMonitor.xcodeproj -scheme "$SCHEME" 2>/dev/null >&2
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run Tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project StressMonitor/StressMonitor.xcodeproj \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath build \
            -resultBundlePath TestResults.xcresult \
            -skipPackagePluginValidation \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee raw-test-output.log | xcpretty

      - name: Upload raw test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: raw-test-output
          path: raw-test-output.log
          retention-days: 5

      - name: Upload xcresult on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-xcresult
          path: TestResults.xcresult
          retention-days: 5
