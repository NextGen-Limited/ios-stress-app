name: Nightly UI Tests

on:
  schedule:
    - cron: "0 3 * * *" # 3 AM UTC daily
  workflow_dispatch:

concurrency:
  group: nightly-ui-tests
  cancel-in-progress: true

env:
  XCODE_VERSION: "26.3"
  LANG: "en_US.UTF-8"

jobs:
  ui-tests:
    name: iOS UI Tests
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer
          xcodebuild -version

      - name: Setup Ruby & Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install iOS Simulator Runtime
        run: |
          if ! xcodebuild -showdestinations -scheme StressMonitor -project StressMonitor/StressMonitor.xcodeproj 2>/dev/null | grep -q "iOS Simulator"; then
            echo "Downloading iOS platform..."
            xcodebuild -downloadPlatform iOS
          fi

      - name: Boot iOS Simulator
        id: simulator
        run: |
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          data = json.load(sys.stdin)
          for runtime, devices in data.get('devices', {}).items():
            if 'iOS' in runtime:
              for d in devices:
                if d.get('isAvailable'):
                  print(d['udid'])
                  sys.exit(0)
          print('')
          ")
          if [ -n "$SIM_ID" ]; then
            xcrun simctl boot "$SIM_ID" 2>/dev/null || true
            echo "sim_id=$SIM_ID" >> $GITHUB_OUTPUT
          fi

      - name: Run iOS UI Tests
        env:
          SCAN_DEVICE: ${{ steps.simulator.outputs.sim_id && format('platform=iOS Simulator,id={0}', steps.simulator.outputs.sim_id) || '' }}
        run: |
          bundle exec fastlane ui_test

      - name: Upload UI Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-results
          path: fastlane/test_output_ui/
          retention-days: 14

      - name: Notify on Failure
        if: failure()
        run: |
          echo "::error::Nightly UI tests failed. Check artifacts for details."

  watchos-ui-tests:
    name: watchOS UI Tests
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer
          xcodebuild -version

      - name: Setup Ruby & Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install watchOS Simulator
        run: |
          if ! xcodebuild -showdestinations -scheme "StressMonitorWatch Watch App" -project StressMonitor/StressMonitor.xcodeproj 2>/dev/null | grep -q "watchOS Simulator"; then
            echo "Installing watchOS Simulator runtime..."
            xcodebuild -downloadPlatform watchOS
          fi

      - name: Run watchOS UI Tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project StressMonitor/StressMonitor.xcodeproj \
            -scheme "StressMonitorWatch Watch AppUITests" \
            -destination 'platform=watchOS Simulator,name=Apple Watch Series 10 (46mm)' \
            -skipPackagePluginValidation \
            | xcpretty || true

      - name: Notify on Failure
        if: failure()
        run: |
          echo "::error::Nightly watchOS UI tests failed."
