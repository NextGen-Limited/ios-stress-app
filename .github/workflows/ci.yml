name: Swift CI

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Xcode ${{ matrix.xcode }})
    runs-on: macos-14
    strategy:
      matrix:
        xcode: ['15.4', '16.0']
        include:
          - xcode: '15.4'
            destination: 'platform=iOS Simulator,name=iPhone 15,OS=17.5'
          - xcode: '16.0'
            destination: 'platform=iOS Simulator,name=iPhone 16,OS=18.0'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app
      
      - name: Show environment
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list devices available | head -20
      
      - name: Build
        run: |
          xcodebuild build \
            -scheme StressMonitor \
            -destination '${{ matrix.destination }}' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty
      
      - name: Test
        run: |
          xcodebuild test \
            -scheme StressMonitor \
            -destination '${{ matrix.destination }}' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.xcode }}
          path: build/Logs/Test/*.xcresult
          retention-days: 7

  build-watch:
    name: Build watchOS
    runs-on: macos-14
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.0.app
      
      - name: Build watchOS app
        run: |
          xcodebuild build \
            -scheme StressMonitorWatchApp \
            -destination 'platform=watchOS Simulator,name=Apple Watch Series 9 (45mm),OS=11.0' \
            -derivedDataPath build-watch \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty

  lint:
    name: SwiftLint
    runs-on: macos-14
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install SwiftLint
        run: brew install swiftlint
      
      - name: Run SwiftLint
        run: swiftlint lint --reporter github-actions-logging
        
  build-settings:
    name: Validate Build Settings
    runs-on: macos-14
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.0.app
      
      - name: Validate project
        run: |
          xcodebuild -list -project StressMonitor.xcodeproj
          echo "✅ Project structure valid"
      
      - name: Check Swift version
        run: |
          swift --version
          echo "✅ Swift available"
