name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Print environment
        run: |
          xcodebuild -version
          python3 --version

      - name: Cache SPM & DerivedData
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
          key: xcode-${{ runner.os }}-${{ hashFiles('StressMonitor/StressMonitor.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: xcode-${{ runner.os }}-

      - name: Run tests
        run: python3 scripts/run-tests.py
        env:
          CI: "1"

      - name: Validate xcresult bundle
        id: xcresult
        if: success() || failure()
        run: |
          if [ -d "StressMonitor/build/TestResults.xcresult" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "xcresult bundle found"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::xcresult bundle not found, skipping test report"
          fi

      - name: Publish test results
        uses: kishikawakatsumi/xcresulttool@v1
        if: (success() || failure()) && steps.xcresult.outputs.exists == 'true'
        with:
          path: StressMonitor/build/TestResults.xcresult
          show-passed-tests: true
          show-code-coverage: true

      - name: Code coverage summary
        if: steps.xcresult.outputs.exists == 'true'
        run: |
          echo "## Code Coverage" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          xcrun xccov view --report StressMonitor/build/TestResults.xcresult 2>/dev/null | head -100 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: steps.xcresult.outputs.exists == 'true'
        with:
          name: test-results
          path: StressMonitor/build/TestResults.xcresult
          retention-days: 7
