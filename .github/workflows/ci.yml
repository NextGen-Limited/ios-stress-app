name: CI

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run unit tests?"
        required: false
        default: true
        type: boolean
      run_watchos_tests:
        description: "Run watchOS tests?"
        required: false
        default: true
        type: boolean

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, Test & Build watchOS
    uses: ./.github/workflows/_test.yml
    with:
      run_tests: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}
      run_watchos_tests: ${{ github.event_name != 'workflow_dispatch' || inputs.run_watchos_tests }}
