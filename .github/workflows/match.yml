name: Match Profiles

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Force profile regeneration (setup_match always forces)"
        required: false
        default: true
        type: boolean

concurrency:
  group: match-${{ github.ref }}
  cancel-in-progress: false

env:
  LANG: en_US.UTF-8

jobs:
  regenerate:
    name: Regenerate App Store profiles
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Ruby Gems
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: gems-${{ runner.os }}-${{ hashFiles('**/Gemfile.lock') }}

      - name: Install Dependencies
        run: |
          bundle config path vendor/bundle
          bundle install --jobs 4 --retry 3

      - name: Regenerate profiles via setup_match
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: bundle exec fastlane setup_match
      - name: Verify profile entitlements
        run: |
          python3 - <<'EOF'
          import glob, os, plistlib, subprocess
          paths = []
          for pat in ("~/Library/Developer/Xcode/UserData/Provisioning Profiles/*.mobileprovision",
                      "~/Library/MobileDevice/Provisioning Profiles/*.mobileprovision"):
              paths += glob.glob(os.path.expanduser(pat))
          print(f"## Regenerated profile entitlements ({len(paths)} profile(s))")
          for p in paths:
              xml = subprocess.run(["security", "cms", "-D", "-i", p],
                                   capture_output=True).stdout
              try:
                  prof = plistlib.loads(xml)
              except Exception:
                  print(f"### {os.path.basename(p)}: UNPARSEABLE")
                  continue
              ent = prof.get("Entitlements", {})
              keys = [k for k in ent if k.startswith("com.apple.developer")]
              groups = ent.get("com.apple.security.application-groups")
              icloud = ent.get("com.apple.developer.icloud-container-identifiers")
              print(f"### {prof.get('Name', '?')}")
              print(f"    capability keys: {keys or 'NONE'}")
              print(f"    app groups: {groups or 'NONE'}")
              print(f"    icloud containers: {icloud or 'NONE'}")
          EOF
