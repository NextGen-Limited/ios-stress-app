name: App Store Release

on:
  workflow_dispatch:
    inputs:
      submit_for_review:
        description: "Submit for App Store review?"
        required: false
        default: true
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # never cancel a release in progress

env:
  LANG: "en_US.UTF-8"

jobs:
  release:
    name: Submit to App Store
    runs-on: macos-15
    timeout-minutes: 20
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Ruby Gems
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: gems-${{ runner.os }}-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: gems-${{ runner.os }}-

      - name: Install Dependencies
        run: |
          bundle config path vendor/bundle
          bundle install --jobs 4 --retry 3

      - name: Submit for App Store Review
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          # App info — single source of truth
          APP_IDENTIFIER: "stress.ai.com"
          WATCH_APP_IDENTIFIER: "stress.ai.com.watchkitapp"
          WIDGET_APP_IDENTIFIER: "stress.ai.com.widget"
          APPLE_ID: "95doanphuong@gmail.com"
          TEAM_ID: "K2TYLYAWMK"
          ITC_TEAM_ID: "K2TYLYAWMK"
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: bundle exec fastlane release

      - name: Notify
        if: always()
        run: echo "Release workflow completed. Check App Store Connect for review status."
