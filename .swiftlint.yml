disabled_rules:
  - trailing_whitespace
opt_in_rules:
  - empty_count
  - closure_spacing
  - force_unwrapping
  - implicitly_unwrapped_optional
  - overridden_super_call
  - private_outlet
  - vertical_whitespace_closing_braces
included:
  - StressMonitor
excluded:
  - Pods
  - .build
  - fastlane
line_length:
  warning: 150
  error: 250
type_body_length:
  warning: 400
  error: 600
