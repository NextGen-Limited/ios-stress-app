			shellScript = "# Generate stub dSYM for GiphyUISDK to suppress App Store Connect warning\nif [ \"$CONFIGURATION\" != \"Release\" ]; then\n    exit 0\nfi\n\nGIPHY_FRAMEWORK=\"${BUILT_PRODUCTS_DIR}/Frameworks/GiphyUISDK.framework\"\nif [ ! -d \"$GIPHY_FRAMEWORK\" ]; then\n    # Also check the direct location\n    GIPHY_FRAMEWORK=\"${BUILT_PRODUCTS_DIR}/GiphyUISDK.framework\"\nfi\nif [ ! -d \"$GIPHY_FRAMEWORK\" ]; then\n    echo \"Warning: GiphyUISDK.framework not found, skipping dSYM stub generation\"\n    exit 0\nfi\n\nFRAMEWORK_BINARY=\"${GIPHY_FRAMEWORK}/GiphyUISDK\"\nif [ ! -f \"$FRAMEWORK_BINARY\" ]; then\n    echo \"Warning: GiphyUISDK binary not found\"\n    exit 0\nfi\n\nUUID=$(xcrun dwarfdump --uuid \"$FRAMEWORK_BINARY\" | head -1 | awk '{print $2}')\nif [ -z \"$UUID\" ]; then\n    echo \"Warning: Could not extract UUID from GiphyUISDK\"\n    exit 0\nfi\n\necho \"Generating stub dSYM for GiphyUISDK (UUID: $UUID)\"\n\nDSYM_DIR=\"${DWARF_DSYM_FOLDER_PATH}/GiphyUISDK.framework.dSYM\"\nmkdir -p \"${DSYM_DIR}/Contents/Resources/DWARF\"\nmkdir -p \"${DSYM_DIR}/Contents\"\n\ncat > \"${DSYM_DIR}/Contents/Info.plist\" << 'PLISTEOF'\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE plist PUBLIC \"-//Apple//DTD PLIST 1.0//EN\" \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\">\n<plist version=\"1.0\">\n<dict>\n    <key>CFBundleIdentifier</key>\n    <string>com.giphy.GiphyUISDK</string>\n    <key>CFBundleName</key>\n    <string>GiphyUISDK</string>\n</dict>\n</plist>\nPLISTEOF\n\n# Copy the binary as the DWARF file (contains the UUID Apple expects)\ncp \"$FRAMEWORK_BINARY\" \"${DSYM_DIR}/Contents/Resources/DWARF/GiphyUISDK\"\n\necho \"Stub dSYM created at ${DSYM_DIR}\"\n";
