<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StressMonitor — Character Deep-Dive</title>
<style>
:root {
  --bg: #0A0A0F;
  --surface: #12121F;
  --card: #1A1A2E;
  --card-hi: #20203A;
  --border: #2A2A4A;
  --text: #E0E0E0;
  --muted: #777986;
  --radius: 16px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.6;
  overflow-x: hidden;
}

/* ── Tab Bar ── */
.tab-bar {
  position: sticky; top: 0; z-index: 100;
  display: flex; gap: 4px; padding: 10px 16px;
  background: rgba(10,10,15,0.92); backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  overflow-x: auto; -webkit-overflow-scrolling: touch;
}
.tab-btn {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 8px 16px; border-radius: 12px; border: 1px solid transparent;
  background: transparent; color: var(--muted); cursor: pointer;
  transition: all 0.25s; white-space: nowrap; min-width: 72px;
}
.tab-btn .emoji { font-size: 1.4rem; }
.tab-btn .name { font-size: 0.72rem; font-weight: 600; }
.tab-btn:hover { background: var(--card); color: var(--text); }
.tab-btn.active { background: var(--card-hi); border-color: var(--accent); color: var(--accent); }

/* ── Character Section ── */
.char-section { display: none; max-width: 800px; margin: 0 auto; padding: 24px 16px 80px; }
.char-section.active { display: block; animation: fadeIn 0.4s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

/* ── Hero ── */
.hero {
  text-align: center; padding: 32px 20px; margin-bottom: 24px;
  background: var(--card); border-radius: var(--radius);
  border: 1px solid var(--border); position: relative; overflow: hidden;
}
.hero::before {
  content: ''; position: absolute; top: -50%; left: -50%;
  width: 200%; height: 200%;
  background: radial-gradient(circle, var(--glow) 0%, transparent 50%);
  opacity: 0.15; pointer-events: none;
}
.hero svg { width: 140px; height: 140px; position: relative; z-index: 1; }
.hero h1 { font-size: 2rem; font-weight: 800; margin-top: 12px; }
.hero .subtitle { color: var(--muted); font-size: 1rem; margin-bottom: 12px; }
.hero .tags {
  display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 16px;
}
.hero .tag {
  padding: 4px 12px; border-radius: 20px; font-size: 0.78rem; font-weight: 600;
  background: var(--accent-dim); color: var(--accent);
}
.hero blockquote {
  font-style: italic; font-size: 1.05rem; color: var(--text);
  border-left: 3px solid var(--accent); padding: 8px 16px;
  max-width: 400px; margin: 0 auto; opacity: 0.9;
}

/* ── Section Block ── */
.block {
  background: var(--card); border-radius: var(--radius); padding: 24px;
  border: 1px solid var(--border); margin-bottom: 16px;
}
.block h2 {
  font-size: 1.2rem; font-weight: 700; margin-bottom: 16px;
  display: flex; align-items: center; gap: 8px;
}
.block p { margin-bottom: 12px; font-size: 0.92rem; color: #C0C0D0; line-height: 1.7; }

/* ── Favorites ── */
.favorites {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 8px; margin-top: 16px;
}
.fav-item {
  background: var(--surface); border-radius: 10px; padding: 10px 12px;
  display: flex; align-items: center; gap: 8px; font-size: 0.82rem;
}
.fav-item .fav-icon { font-size: 1.1rem; }
.fav-item .fav-label { color: var(--muted); font-size: 0.72rem; display: block; }
.fav-item .fav-value { color: var(--text); font-weight: 500; }

/* ── Evolution ── */
.evo-timeline {
  display: flex; gap: 8px; flex-wrap: wrap; align-items: stretch;
}
.evo-stage {
  flex: 1; min-width: 160px; background: var(--surface); border-radius: 12px;
  padding: 16px; border: 1px solid var(--border); position: relative;
  transition: all 0.2s;
}
.evo-stage:hover { border-color: var(--accent-dim); transform: translateY(-2px); }
.evo-stage .evo-icon { font-size: 1.6rem; margin-bottom: 4px; }
.evo-stage .evo-name { font-weight: 700; font-size: 0.95rem; }
.evo-stage .evo-trigger { color: var(--muted); font-size: 0.78rem; margin-top: 4px; }
.evo-stage .evo-desc { font-size: 0.82rem; margin-top: 6px; color: #B0B0C0; }
.evo-arrow { display: flex; align-items: center; color: var(--muted); font-size: 1.2rem; }

/* ── Stress Reactions ── */
.reactions-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 8px;
}
.reaction {
  background: var(--surface); border-radius: 12px; padding: 16px 8px;
  text-align: center; border: 1px solid var(--border); transition: all 0.2s;
}
.reaction:hover { border-color: var(--accent-dim); }
.reaction svg { width: 48px; height: 48px; margin-bottom: 4px; }
.reaction .r-level { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
.reaction .r-range { font-size: 0.7rem; color: var(--muted); }

/* ── Color Palette ── */
.palette-grid { display: flex; gap: 8px; flex-wrap: wrap; }
.color-token {
  flex: 1; min-width: 100px; border-radius: 12px; overflow: hidden;
  border: 1px solid var(--border);
}
.color-swatch { height: 60px; }
.color-info { padding: 8px; background: var(--surface); }
.color-info .c-name { font-size: 0.72rem; font-weight: 700; }
.color-info .c-hex { font-size: 0.7rem; color: var(--muted); font-family: monospace; }

/* ── Interactive Slider ── */
.slider-section {
  background: var(--card); border-radius: var(--radius); padding: 24px;
  border: 1px solid var(--border); margin-bottom: 16px;
}
.slider-display {
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  padding: 24px 0;
}
.slider-display svg { width: 120px; height: 120px; transition: filter 0.3s; }
.slider-label {
  font-size: 0.9rem; font-weight: 600; color: var(--accent);
  padding: 4px 16px; border-radius: 20px; background: var(--accent-dim);
}
.slider-wrap { width: 100%; max-width: 400px; margin: 0 auto; }
input[type="range"] {
  -webkit-appearance: none; width: 100%; height: 8px; border-radius: 4px;
  background: linear-gradient(90deg, #4FC3F7, #A5D6A7, #FFE082, #FFAB91, #EF5350);
  outline: none;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 28px; height: 28px; border-radius: 50%;
  background: var(--text); border: 3px solid var(--bg); cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,0.4);
}
input[type="range"]::-moz-range-thumb {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--text); border: 3px solid var(--bg); cursor: pointer;
}

/* ── Responsive ── */
@media (max-width: 600px) {
  .evo-timeline { flex-direction: column; }
  .evo-arrow { transform: rotate(90deg); justify-content: center; }
  .hero svg { width: 100px; height: 100px; }
  .hero h1 { font-size: 1.5rem; }
}
</style>

// SVG CHARACTER GENERATOR
// ═══════════════════════════════════════════════
function stressTier(level) {
  if (level <= 20) return 0; // resting
  if (level <= 40) return 1; // calm
  if (level <= 60) return 2; // balanced
  if (level <= 80) return 3; // tense
  return 4;                   // overwhelmed
}

const STRESS_LABELS = [
  { name: 'Resting', emoji: '😴', color: '#4FC3F7' },
  { name: 'Calm', emoji: '😊', color: '#A5D6A7' },
  { name: 'Balanced', emoji: '😐', color: '#FFE082' },
  { name: 'Tense', emoji: '😰', color: '#FFAB91' },
  { name: 'Overwhelmed', emoji: '🐚', color: '#EF5350' }
];

function genCharSVG(element, stressLevel, size) {
  size = size || 120;
  const tier = stressTier(stressLevel);
  const colors = getElementColors(element);
  const cx = size / 2;
  const r = size * 0.32;

  // Body shape (slight wobble when stressed)
  const wobble = tier >= 3 ? (Math.random() - 0.5) * 4 : 0;

  // Eyes
  let eyes;
  if (tier === 0) { // sleeping
    eyes = `
      <path d="M${cx-18},${r*1.2} q6,-6 12,0" stroke="${colors.deep}" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M${cx+6},${r*1.2} q6,-6 12,0" stroke="${colors.deep}" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
  } else if (tier === 4) { // overwhelmed — X eyes
    eyes = `
      <g stroke="${colors.deep}" stroke-width="2.5" stroke-linecap="round">
        <line x1="${cx-20}" y1="${r*1.1}" x2="${cx-10}" y2="${r*1.3}"/>
        <line x1="${cx-10}" y1="${r*1.1}" x2="${cx-20}" y2="${r*1.3}"/>
        <line x1="${cx+10}" y1="${r*1.1}" x2="${cx+20}" y2="${r*1.3}"/>
        <line x1="${cx+20}" y1="${r*1.1}" x2="${cx+10}" y2="${r*1.3}"/>
      </g>`;
  } else {
    const eyeR = tier === 3 ? 7 : 6; // wider when tense
    const pupilR = tier === 3 ? 2.5 : 3.5; // smaller pupils when tense
    eyes = `
      <circle cx="${cx-14}" cy="${r*1.2}" r="${eyeR}" fill="white"/>
      <circle cx="${cx+14}" cy="${r*1.2}" r="${eyeR}" fill="white"/>
      <circle cx="${cx-14}" cy="${r*1.2}" r="${pupilR}" fill="${colors.deep}"/>
      <circle cx="${cx+14}" cy="${r*1.2}" r="${pupilR}" fill="${colors.deep}"/>
      ${tier === 1 ? `<circle cx="${cx-12}" cy="${r*1.18}" r="1.5" fill="white"/><circle cx="${cx+16}" cy="${r*1.18}" r="1.5" fill="white"/>` : ''}`;
  }

  // Mouth
  let mouth;
  if (tier === 0) { // sleeping — small O
    mouth = `<ellipse cx="${cx}" cy="${r*1.7}" rx="4" ry="3" fill="${colors.deep}" opacity="0.6"/>`;
  } else if (tier === 1) { // calm — big smile
    mouth = `<path d="M${cx-12},${r*1.6} Q${cx},${r*1.8} ${cx+12},${r*1.6}" stroke="${colors.deep}" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
  } else if (tier === 2) { // balanced — straight
    mouth = `<line x1="${cx-8}" y1="${r*1.7}" x2="${cx+8}" y2="${r*1.7}" stroke="${colors.deep}" stroke-width="2.5" stroke-linecap="round"/>`;
  } else if (tier === 3) { // tense — wavy
    mouth = `<path d="M${cx-10},${r*1.7} q5,-4 10,0 q5,4 10,0" stroke="${colors.deep}" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
  } else { // overwhelmed — frown
    mouth = `<path d="M${cx-12},${r*1.8} Q${cx},${r*1.5} ${cx+12},${r*1.8}" stroke="${colors.deep}" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
  }

  // Element decorations
  let decor = '';
  if (element === 'water') {
    // Droplet on top + shell when overwhelmed
    decor += `<path d="M${cx},${size*0.08} Q${cx-8},${size*0.15} ${cx},${size*0.2} Q${cx+8},${size*0.15} ${cx},${size*0.08} Z" fill="${colors.secondary}" opacity="0.8"/>`;
    if (tier === 4) {
      decor += `<ellipse cx="${cx}" cy="${r*1.5}" rx="${r*1.1}" ry="${r*1.3}" fill="${colors.deep}" opacity="0.3"/>`;
    }
    // Water ripples
    if (tier <= 1) {
      decor += `<path d="M${cx-r*0.8},${r*2.2} q8,4 16,0" stroke="${colors.secondary}" stroke-width="1.5" fill="none" opacity="0.5"/>`;
      decor += `<path d="M${cx-r*0.6},${r*2.5} q6,3 12,0" stroke="${colors.secondary}" stroke-width="1" fill="none" opacity="0.3"/>`;
    }
  } else if (element === 'earth') {
    // Leaf ears
    decor += `<ellipse cx="${cx-r*0.7}" cy="${r*0.5}" rx="6" ry="12" fill="${colors.accent}" transform="rotate(-30 ${cx-r*0.7} ${r*0.5})" opacity="0.8"/>`;
    decor += `<ellipse cx="${cx+r*0.7}" cy="${r*0.5}" rx="6" ry="12" fill="${colors.accent}" transform="rotate(30 ${cx+r*0.7} ${r*0.5})" opacity="0.8"/>`;
    // Flower when calm
    if (tier <= 1) {
      decor += `<circle cx="${cx}" cy="${r*0.3}" r="4" fill="${colors.secondary}"/>`;
      decor += `<circle cx="${cx-5}" cy="${r*0.25}" r="3" fill="${colors.secondary}" opacity="0.7"/>`;
      decor += `<circle cx="${cx+5}" cy="${r*0.25}" r="3" fill="${colors.secondary}" opacity="0.7"/>`;
    }
  } else if (element === 'fire') {
    // Flame crest
    const flameH = tier >= 3 ? 16 : 20;
    decor += `<path d="M${cx},${size*0.04} Q${cx-10},${size*0.12} ${cx-4},${size*0.18} Q${cx},${size*0.1} ${cx+4},${size*0.18} Q${cx+10},${size*0.12} ${cx},${size*0.04} Z" fill="${colors.accent}" opacity="0.9"/>`;
    if (tier >= 4) {
      // Smoke when overwhelmed
      decor += `<circle cx="${cx-8}" cy="${size*0.05}" r="3" fill="#666" opacity="0.4"/>`;
      decor += `<circle cx="${cx+6}" cy="${size*0.03}" r="4" fill="#666" opacity="0.3"/>`;
    }
  } else if (element === 'air') {
    // Cloud wisps
    decor += `<ellipse cx="${cx-r}" cy="${r*1.3}" rx="10" ry="6" fill="${colors.secondary}" opacity="0.5"/>`;
    decor += `<ellipse cx="${cx+r}" cy="${r*1.3}" rx="10" ry="6" fill="${colors.secondary}" opacity="0.5"/>`;
    if (tier >= 3) {
      // Jagged cloud when tense
      decor += `<path d="M${cx-15},${r*0.4} L${cx-8},${r*0.2} L${cx},${r*0.4} L${cx+8},${r*0.2} L${cx+15},${r*0.4}" stroke="${colors.accent}" stroke-width="1.5" fill="none" opacity="0.4"/>`;
    }
  } else if (element === 'moon') {
    // Crescent moon mark
    decor += `<path d="M${cx-r*0.4},${r*0.4} a6,6 0 1,0 8,-2 a4,4 0 1,1 -8,2 Z" fill="${colors.secondary}" opacity="0.7"/>`;
    // Stars around
    if (tier <= 1) {
      decor += `<text x="${cx-r*1.3}" y="${r*0.8}" font-size="8" opacity="0.6">\u2728</text>`;
      decor += `<text x="${cx+r*0.9}" y="${r*0.6}" font-size="6" opacity="0.4">\u2728</text>`;
    }
    // Glow effect
    const glowOpacity = tier === 0 ? 0.4 : (4-tier) * 0.08;
    decor += `<circle cx="${cx}" cy="${r*1.4}" r="${r*1.3}" fill="${colors.secondary}" opacity="${glowOpacity}"/>`;
  }

  // Body
  const bodyScale = tier === 4 ? 0.85 : (tier === 0 ? 0.95 : 1.0);
  const bodyR = r * bodyScale;

  return `
  <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">
    <!-- Shadow -->
    <ellipse cx="${cx}" cy="${size*0.92}" rx="${bodyR*0.7}" ry="${bodyR*0.12}" fill="#000" opacity="0.2"/>
    <!-- Body -->
    <ellipse cx="${cx + wobble}" cy="${r*1.4}" rx="${bodyR}" ry="${bodyR*1.05}" fill="${colors.primary}" opacity="0.9"/>
    <!-- Belly highlight -->
    <ellipse cx="${cx + wobble}" cy="${r*1.5}" rx="${bodyR*0.6}" ry="${bodyR*0.7}" fill="${colors.secondary}" opacity="0.3"/>
    <!-- Decorations -->
    ${decor}
    <!-- Face -->
    ${eyes}
    ${mouth}
    <!-- Cheeks when calm -->
    ${tier <= 1 ? `<circle cx="${cx-22}" cy="${r*1.5}" r="5" fill="${colors.accent}" opacity="0.2"/><circle cx="${cx+22}" cy="${r*1.5}" r="5" fill="${colors.accent}" opacity="0.2"/>` : ''}
  </svg>`;
}

function getElementColors(element) {
  const map = {
    water: { primary: '#4FC3F7', secondary: '#B3E5FC', accent: '#0288D1', deep: '#01579B' },
    earth: { primary: '#A5D6A7', secondary: '#C8E6C9', accent: '#2E7D32', deep: '#1B5E20' },
    fire:  { primary: '#FFAB91', secondary: '#FBE9E7', accent: '#E65100', deep: '#BF360C' },
    air:   { primary: '#D1C4E9', secondary: '#EDE7F6', accent: '#7E57C2', deep: '#4A148C' },
    moon:  { primary: '#7986CB', secondary: '#C5CAE9', accent: '#3949AB', deep: '#1A237E' }
  };
  return map[element] || map.water;
}

// ═══════════════════════════════════════════════
// HTML GENERATION
// ═══════════════════════════════════════════════
function buildCharacterSection(char) {
  const c = char.colors;

  // Reactions grid
  const reactionsHTML = char.stressReactions.map((r, i) => `
    <div class="reaction">
      ${genCharSVG(char.element, i * 20 + 10, 48)}
      <div class="r-level" style="color:${STRESS_LABELS[i].color}">${r.level}</div>
      <div class="r-range">${r.range}</div>
    </div>
  `).join('');

  // Palette
  const paletteHTML = [
    { name: 'Primary', hex: c.primary },
    { name: 'Secondary', hex: c.secondary },
    { name: 'Light', hex: c.light },
    { name: 'Accent', hex: c.accent },
    { name: 'Deep', hex: c.deep }
  ].map(t => `
    <div class="color-token">
      <div class="color-swatch" style="background:${t.hex}"></div>
      <div class="color-info">
        <div class="c-name">${t.name}</div>
        <div class="c-hex">${t.hex}</div>
      </div>
    </div>
  `).join('');

  // Evolution timeline
  const evoHTML = char.evolution.map((e, i) => {
    const arrow = i < char.evolution.length - 1 ? '<div class="evo-arrow">→</div>' : '';
    return `
      <div class="evo-stage">
        <div class="evo-icon">${e.icon}</div>
        <div class="evo-name">${e.name}</div>
        <div class="evo-trigger">${e.trigger}</div>
        <div class="evo-desc">${e.desc}</div>
      </div>
      ${arrow}
    `;
  }).join('');

  // Favorites
  const favHTML = char.favorites.map(f => `
    <div class="fav-item">
      <span class="fav-icon">${f.icon}</span>
      <div><span class="fav-label">${f.label}</span><span class="fav-value">${f.value}</span></div>
    </div>
  `).join('');

  return `
  <div class="char-section" id="char-${char.id}" style="--accent:${c.primary}; --accent-dim:${c.primary}33; --glow:${c.primary};">
    <!-- Hero -->
    <div class="hero">
      ${genCharSVG(char.element, 25, 140)}
      <h1>${char.name}</h1>
      <p class="subtitle">${char.subtitle} · ${char.emoji}</p>
      <div class="tags">
        ${char.personality.map(p => `<span class="tag">${p}</span>`).join('')}
      </div>
      <blockquote>"${char.quote}"</blockquote>
      <p style="margin-top:12px;font-size:0.78rem;color:var(--muted)">🔓 ${char.unlock}</p>
    </div>

    <!-- Backstory -->
    <div class="block">
      <h2>📖 Backstory</h2>
      ${char.lore.map(p => `<p>${p}</p>`).join('')}
      <div class="favorites">${favHTML}</div>
    </div>

    <!-- Evolution -->
    <div class="block">
      <h2>✨ Evolution Journey</h2>
      <div class="evo-timeline">${evoHTML}</div>
    </div>

    <!-- Stress Reactions -->
    <div class="block">
      <h2>🎭 Stress Reactions</h2>
      <p style="margin-bottom:12px;color:var(--muted);font-size:0.82rem">Character IS the indicator — no numbers, just expressions.</p>
      <div class="reactions-grid">${reactionsHTML}</div>
    </div>

    <!-- Color Palette -->
    <div class="block">
      <h2>🎨 Color Palette</h2>
      <div class="palette-grid">${paletteHTML}</div>
    </div>

    <!-- Interactive Slider -->
    <div class="slider-section">
      <h2 style="margin-bottom:0">⚡ Interactive Stress Slider</h2>
      <p style="margin-bottom:8px;color:var(--muted);font-size:0.82rem">Drag to see ${char.name} react in real-time</p>
      <div class="slider-display">
        <div id="slider-svg-${char.id}">${genCharSVG(char.element, 20, 120)}</div>
        <div class="slider-label" id="slider-label-${char.id}" style="color:${STRESS_LABELS[0].color};background:${STRESS_LABELS[0].color}33">${STRESS_LABELS[0].emoji} ${STRESS_LABELS[0].name}</div>
      </div>
      <div class="slider-wrap">
        <input type="range" min="0" max="100" value="20" id="slider-${char.id}"
               oninput="updateSlider('${char.id}','${char.element}', this.value)">
      </div>
    </div>
  </div>`;
}

// ═══════════════════════════════════════════════
// INITIALIZATION
// ═══════════════════════════════════════════════

// Build tabs
const tabBar = document.getElementById('tabBar');
tabBar.innerHTML = CHARACTERS.map((c, i) => `
  <button class="tab-btn ${i === 0 ? 'active' : ''}" data-char="${c.id}" onclick="selectChar('${c.id}')">
    <span class="emoji">${c.emoji}</span>
    <span class="name">${c.name}</span>
  </button>
`).join('');

// Build sections
document.getElementById('sections').innerHTML = CHARACTERS.map(buildCharacterSection).join('');

// Show first character
document.getElementById('char-' + CHARACTERS[0].id).classList.add('active');

function selectChar(id) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.char === id));
  document.querySelectorAll('.char-section').forEach(s => s.classList.toggle('active', s.id === 'char-' + id));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function updateSlider(charId, element, value) {
  const v = parseInt(value);
  const tier = stressTier(v);
  const label = STRESS_LABELS[tier];

  document.getElementById('slider-svg-' + charId).innerHTML = genCharSVG(element, v, 120);
  const labelEl = document.getElementById('slider-label-' + charId);
  labelEl.textContent = `${label.emoji} ${label.name}`;
  labelEl.style.color = label.color;
  labelEl.style.background = label.color + '33';
}
</script>
</body>
</html>
