<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>08 · Breathing Active — StressMonitor</title>
  <link rel="stylesheet" href="../css/app.css" />
  <style>
    .breath-stage {
      flex: 1;
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      padding: 32px 24px 32px;
      background:
        radial-gradient(70% 50% at 50% 50%, rgba(79,195,247,0.22) 0%, transparent 70%),
        linear-gradient(180deg, #ECF8FE 0%, #FFFFFF 100%);
    }
    .phase-tag {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 14px;
      background: rgba(255,255,255,0.7);
      border: 1px solid rgba(79,195,247,0.3);
      border-radius: 999px;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent-strong);
      backdrop-filter: blur(8px);
    }
    .breath-arena {
      position: relative;
      width: 280px; height: 280px;
      display: grid; place-items: center;
    }
    .breath-ring { position: absolute; border-radius: 50%; }
    .breath-ring.r1 {
      width: 100%; height: 100%;
      background: radial-gradient(circle, rgba(79,195,247,0.18) 0%, transparent 70%);
      animation: breathe1 16s ease-in-out infinite;
    }
    .breath-ring.r2 {
      width: 70%; height: 70%;
      background: radial-gradient(circle, rgba(79,195,247,0.30) 0%, transparent 70%);
      animation: breathe2 16s ease-in-out infinite;
    }
    .breath-ring.r3 {
      width: 42%; height: 42%;
      background: linear-gradient(135deg, #4FC3F7, #0288D1);
      box-shadow: 0 20px 50px -10px rgba(79,195,247,0.5);
      animation: breathe3 16s ease-in-out infinite;
      display: grid; place-items: center;
    }
    @keyframes breathe1 {
      0%, 100% { transform: scale(0.85); }
      25% { transform: scale(1.05); }
      50% { transform: scale(1.05); }
      75% { transform: scale(0.85); }
    }
    @keyframes breathe2 {
      0%, 100% { transform: scale(0.85); opacity: 0.7; }
      25% { transform: scale(1.10); opacity: 1; }
      50% { transform: scale(1.10); opacity: 1; }
      75% { transform: scale(0.85); opacity: 0.7; }
    }
    @keyframes breathe3 {
      0%, 100% { transform: scale(0.85); }
      25% { transform: scale(1.15); }
      50% { transform: scale(1.15); }
      75% { transform: scale(0.85); }
    }
    .breath-instruction {
      position: relative; z-index: 2;
      text-align: center;
      color: #fff;
      pointer-events: none;
    }
    .breath-instruction .word {
      font-family: var(--font-rounded);
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .breath-instruction .count {
      font-family: var(--font-mono);
      font-size: 48px;
      font-weight: 700;
      line-height: 1;
      margin-top: 4px;
    }

    .phase-track {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px;
      width: 100%;
      max-width: 280px;
    }
    .phase-step { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .phase-step .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: rgba(60,60,67,0.18);
    }
    .phase-step.active .dot { background: var(--accent-strong); transform: scale(1.4); }
    .phase-step.done .dot { background: var(--accent); }
    .phase-step .lbl {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.04em;
      color: var(--muted);
      text-transform: uppercase;
    }
    .phase-step.active .lbl { color: var(--accent-strong); font-weight: 700; }

    .meta-row {
      display: flex; gap: 24px; align-items: baseline; justify-content: center;
      width: 100%;
    }
    .meta-row .block { text-align: center; }
    .meta-row .block .v { font-family: var(--font-rounded); font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
    .meta-row .block .l { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }

    .btn-row { display: flex; gap: 10px; width: 100%; max-width: 280px; }
    .btn-row a {
      flex: 1;
      padding: 14px;
      text-align: center;
      border-radius: 14px;
      font-family: var(--font-body);
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
    }
    .btn-row .pause { background: var(--fg); color: #fff; }
    .btn-row .skip { background: rgba(60,60,67,0.08); color: var(--fg); }

    .progress-track {
      width: 100%; max-width: 280px;
      height: 4px;
      background: rgba(60,60,67,0.10);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-track > span {
      display: block; height: 100%;
      background: var(--accent);
      width: 38%;
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="caption"><a href="13-breathing-intro.html" class="nav-back">‹ Intro</a> <strong>STRESSMONITOR</strong> · 08 Breathing</div>

    <div class="device" data-od-id="device">
      <span class="btn-rail left-1" aria-hidden></span>
      <span class="btn-rail left-2" aria-hidden></span>
      <span class="btn-rail left-3" aria-hidden></span>
      <span class="btn-rail right-1" aria-hidden></span>
      <span class="island" aria-hidden></span>

      <div class="screen">
        <div class="statusbar">
          <span class="num">9:41</span>
          <span class="right">
            <svg viewBox="0 0 17 11" aria-hidden><rect x="0" y="7" width="3" height="4" rx="0.6"/><rect x="4" y="5" width="3" height="6" rx="0.6"/><rect x="8" y="3" width="3" height="8" rx="0.6"/><rect x="12" y="0" width="3" height="11" rx="0.6"/></svg>
            <svg viewBox="0 0 17 11" aria-hidden><path d="M8.5 1.5C5.5 1.5 2.7 2.6 0.5 4.6L2 6.1C3.8 4.5 6.1 3.6 8.5 3.6c2.4 0 4.7 0.9 6.5 2.5l1.5-1.5c-2.2-2-5-3.1-8-3.1zM3.5 7.6L5 9.1c1-0.9 2.2-1.4 3.5-1.4 1.3 0 2.5 0.5 3.5 1.4l1.5-1.5c-1.4-1.3-3.1-2-5-2-1.9 0-3.6 0.7-5 2zM6.5 10.6l2 2 2-2c-0.5-0.5-1.2-0.8-2-0.8s-1.5 0.3-2 0.8z"/></svg>
            <svg class="battery" viewBox="0 0 25 11" aria-hidden><rect x="0.5" y="0.5" width="21" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-opacity="0.45"/><rect x="22" y="3.5" width="1.5" height="4" rx="0.4" fill="currentColor" fill-opacity="0.45"/><rect x="2" y="2" width="18" height="7" rx="1.4"/></svg>
          </span>
        </div>

        <main class="content" data-od-id="content" style="padding: 0;">
          <div class="breath-stage">
            <div class="meta-row">
              <div class="block">
                <div class="v">2:14</div>
                <div class="l">remaining</div>
              </div>
              <div style="width: 1px; align-self: stretch; background: var(--separator); margin: 4px 0;"></div>
              <div class="block">
                <div class="v">3<span style="font-size: 14px; color: var(--muted); font-family: var(--font-body); font-weight: 500;">/8</span></div>
                <div class="l">cycles</div>
              </div>
            </div>

            <div class="breath-arena">
              <div class="breath-ring r1"></div>
              <div class="breath-ring r2"></div>
              <div class="breath-ring r3">
                <div class="breath-instruction">
                  <div class="word">Hold</div>
                  <div class="count">3</div>
                </div>
              </div>
            </div>

            <div class="phase-track">
              <div class="phase-step done">
                <span class="dot"></span>
                <span class="lbl">Inhale 4</span>
              </div>
              <div class="phase-step done">
                <span class="dot"></span>
                <span class="lbl">Hold 4</span>
              </div>
              <div class="phase-step active">
                <span class="dot"></span>
                <span class="lbl">Exhale 4</span>
              </div>
              <div class="phase-step">
                <span class="dot"></span>
                <span class="lbl">Hold 4</span>
              </div>
            </div>

            <div style="display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 280px;">
              <div class="progress-track"><span></span></div>
              <div class="btn-row">
                <a href="13-breathing-intro.html" class="skip">End early</a>
                <a href="14-breathing-summary.html" class="pause">Skip cycle</a>
              </div>
              <p style="font-size: 12px; color: var(--muted); text-align: center; margin: 4px 0 0;">Haptic + heartbeat on each transition</p>
            </div>
          </div>
        </main>

        <div class="home-indicator" aria-hidden></div>
      </div>
    </div>
  </div>
</body>
</html>
