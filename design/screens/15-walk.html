<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>15 · Mini Walk — StressMonitor</title>
  <link rel="stylesheet" href="../css/app.css" />
  <style>
    .walk-stage {
      flex: 1;
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      padding: 20px 24px 24px;
      background:
        radial-gradient(80% 50% at 50% 100%, rgba(165,214,167,0.30) 0%, transparent 70%),
        linear-gradient(180deg, #F4FBF4 0%, #FFFFFF 50%);
    }
    .walk-head { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 0 8px; }
    .walk-head .wh-l { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    .walk-head .wh-r { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; background: rgba(52,199,89,0.14); border-radius: 999px; color: var(--success); font-size: 12px; font-weight: 600; }
    .walk-head .wh-r .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

    .timer-wrap {
      position: relative;
      width: 260px; height: 260px;
      display: grid; place-items: center;
      margin: 12px 0;
    }
    .timer-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .timer-wrap .center {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    }
    .timer-wrap .walk-icon {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, #A5D6A7, #66BB6A);
      border-radius: 16px;
      display: grid; place-items: center;
      color: #fff;
      box-shadow: 0 12px 28px -10px rgba(102,187,106,0.5);
    }
    .timer-wrap .walk-icon svg { width: 32px; height: 32px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .timer-wrap .time {
      font-family: var(--font-rounded);
      font-size: 56px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--fg);
    }
    .timer-wrap .sub { font-family: var(--font-mono); font-size: 11px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }

    .live-stats {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%;
    }
    .ls-tile {
      background: rgba(255,255,255,0.8);
      border: 1px solid var(--separator);
      border-radius: 14px;
      padding: 12px 8px;
      text-align: center;
      backdrop-filter: blur(8px);
    }
    .ls-tile .v { font-family: var(--font-rounded); font-size: 22px; font-weight: 700; letter-spacing: -0.015em; }
    .ls-tile .l { font-family: var(--font-mono); font-size: 10px; color: var(--muted); margin-top: 2px; letter-spacing: 0.04em; text-transform: uppercase; }

    .route-card {
      width: 100%;
      background: var(--surface);
      border-radius: 14px;
      padding: 14px;
      display: flex; align-items: center; gap: 12px;
    }
    .route-card .map-mini {
      width: 60px; height: 60px;
      border-radius: 12px;
      background:
        linear-gradient(135deg, rgba(165,214,167,0.4), rgba(79,195,247,0.3)),
        #F1F8E9;
      position: relative;
      overflow: hidden;
      flex: 0 0 60px;
    }
    .route-card .map-mini svg { width: 100%; height: 100%; }
    .route-card .rc-body { flex: 1; }
    .route-card .rc-title { font-size: 14px; font-weight: 600; }
    .route-card .rc-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .route-card .rc-pace { font-family: var(--font-rounded); font-size: 16px; font-weight: 700; color: var(--blossom); text-align: right; }
    .route-card .rc-pace-lbl { font-family: var(--font-mono); font-size: 9px; color: var(--muted); }

    .btn-row { display: flex; gap: 10px; width: 100%; }
    .btn-row a {
      flex: 1;
      padding: 14px;
      text-align: center;
      border-radius: 14px;
      font-family: var(--font-body);
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
    }
    .btn-row .stop { background: var(--danger); color: #fff; }
    .btn-row .pause { background: rgba(60,60,67,0.08); color: var(--fg); }

    .target-line {
      width: 100%;
      display: flex; align-items: baseline; justify-content: space-between;
      font-size: 13px; color: var(--fg-secondary);
    }
    .target-line .strong { font-family: var(--font-rounded); font-size: 16px; font-weight: 700; color: var(--fg); }
  </style>
</head>
<body>
  <div class="stage">
    <div class="caption"><a href="05-action.html" class="nav-back">‹ Action</a> <strong>STRESSMONITOR</strong> · 15 Mini Walk</div>

    <div class="device" data-od-id="device">
      <span class="btn-rail left-1" aria-hidden></span>
      <span class="btn-rail left-2" aria-hidden></span>
      <span class="btn-rail left-3" aria-hidden></span>
      <span class="btn-rail right-1" aria-hidden></span>
      <span class="island" aria-hidden></span>

      <div class="screen">
        <div class="statusbar">
          <span class="num">9:41</span>
          <span class="right">
            <svg viewBox="0 0 17 11" aria-hidden><rect x="0" y="7" width="3" height="4" rx="0.6"/><rect x="4" y="5" width="3" height="6" rx="0.6"/><rect x="8" y="3" width="3" height="8" rx="0.6"/><rect x="12" y="0" width="3" height="11" rx="0.6"/></svg>
            <svg viewBox="0 0 17 11" aria-hidden><path d="M8.5 1.5C5.5 1.5 2.7 2.6 0.5 4.6L2 6.1C3.8 4.5 6.1 3.6 8.5 3.6c2.4 0 4.7 0.9 6.5 2.5l1.5-1.5c-2.2-2-5-3.1-8-3.1zM3.5 7.6L5 9.1c1-0.9 2.2-1.4 3.5-1.4 1.3 0 2.5 0.5 3.5 1.4l1.5-1.5c-1.4-1.3-3.1-2-5-2-1.9 0-3.6 0.7-5 2zM6.5 10.6l2 2 2-2c-0.5-0.5-1.2-0.8-2-0.8s-1.5 0.3-2 0.8z"/></svg>
            <svg class="battery" viewBox="0 0 25 11" aria-hidden><rect x="0.5" y="0.5" width="21" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-opacity="0.45"/><rect x="22" y="3.5" width="1.5" height="4" rx="0.4" fill="currentColor" fill-opacity="0.45"/><rect x="2" y="2" width="18" height="7" rx="1.4"/></svg>
          </span>
        </div>

        <main class="content" data-od-id="content" style="padding: 0;">
          <div class="walk-stage">
            <div class="walk-head">
              <span class="wh-l">Mini walk · Outdoor</span>
              <span class="wh-r"><span class="dot"></span> LIVE</span>
            </div>

            <div class="timer-wrap">
              <svg viewBox="0 0 260 260">
                <circle cx="130" cy="130" r="118" fill="none" stroke="rgba(60,60,67,0.08)" stroke-width="10"/>
                <circle cx="130" cy="130" r="118" fill="none" stroke="#66BB6A" stroke-width="10" stroke-linecap="round" stroke-dasharray="741.4" stroke-dashoffset="296.6"/>
              </svg>
              <div class="center">
                <div class="walk-icon">
                  <svg viewBox="0 0 24 24"><circle cx="13" cy="4" r="2"/><path d="M9 21l3-6-3-3 2-7 4 4 3-1"/><path d="M6 14l3-1"/></svg>
                </div>
                <div class="time">2:14</div>
                <div class="sub">of 5:00 target</div>
              </div>
            </div>

            <div class="target-line">
              <span>Goal · 600 steps · 5 min</span>
              <span class="strong">47%</span>
            </div>

            <div class="live-stats">
              <div class="ls-tile">
                <div class="v" style="color: var(--blossom);">284</div>
                <div class="l">Steps</div>
              </div>
              <div class="ls-tile">
                <div class="v" style="color: var(--hr-color);">82<span style="font-size: 11px; color: var(--muted); font-family: var(--font-body);">bpm</span></div>
                <div class="l">Heart rate</div>
              </div>
              <div class="ls-tile">
                <div class="v" style="color: var(--success);">0.13<span style="font-size: 11px; color: var(--muted); font-family: var(--font-body);">mi</span></div>
                <div class="l">Distance</div>
              </div>
            </div>

            <div class="route-card">
              <div class="map-mini">
                <svg viewBox="0 0 60 60">
                  <path d="M10 50 Q20 30 30 35 Q40 40 50 12" stroke="#66BB6A" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="3 2"/>
                  <circle cx="10" cy="50" r="4" fill="#66BB6A"/>
                  <circle cx="50" cy="12" r="3" fill="#FF9500"/>
                </svg>
              </div>
              <div class="rc-body">
                <div class="rc-title">Stevens Creek Park</div>
                <div class="rc-sub">Light trail · sunny · 64°F</div>
              </div>
              <div>
                <div class="rc-pace">14:22</div>
                <div class="rc-pace-lbl">min/mi</div>
              </div>
            </div>

            <div class="btn-row">
              <a href="05-action.html" class="pause">Pause</a>
              <a href="14-breathing-summary.html" class="stop">End Session</a>
            </div>
          </div>
        </main>

        <div class="home-indicator" aria-hidden></div>
      </div>
    </div>
  </div>
</body>
</html>
